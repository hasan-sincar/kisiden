workflows:
  ios-release:
    name: iOS Build
    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Install dependencies and Generate Icons
        script: |
          flutter clean
          flutter pub get
          dart run flutter_launcher_icons

      - name: Check files, install pods and build IPA
        script: |
          echo "--- GoogleService-Info.plist dosyasının varlığı kontrol ediliyor... ---"
          ls -l ios/Runner
          echo "--------------------------------------------------------------------"
          cd ios && pod install && cd ..
          flutter build ipa --release --build-number=$BUILD_NUMBER --export-method app-store

    artifacts:
      - build/ios/ipa/*.ipa
